<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人立方体</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #info {
      position: fixed; top: 10px; left: 10px; color: #fff;
      font-family: monospace; font-size: 14px; z-index: 10;
      background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
      pointer-events: none;
    }
    #name-tag {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #fff; font-family: monospace; font-size: 16px; z-index: 10;
      background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 20px;
    }
    #chat-box {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #222; color: #fff; padding: 20px; border-radius: 10px;
      font-family: monospace; z-index: 100; box-shadow: 0 0 20px #000;
    }
    #chat-input {
      width: 260px; padding: 8px; font-size: 14px;
      background: #333; color: #fff; border: 1px solid #555; border-radius: 5px;
    }
    .bubble {
      position: fixed; font-size: 28px; cursor: pointer;
      z-index: 50; user-select: none;
      filter: drop-shadow(0 0 6px #ff0);
      transition: transform 0.15s;
    }
    .bubble:hover { transform: scale(1.3); }
  </style>
</head>
<body>
  <div id="info">WASD 移动 / 方向键旋转 / 双击别人方块发私信</div>
  <div id="name-tag">连接中...</div>

  <div id="chat-box">
    <div id="chat-target" style="margin-bottom: 10px;"></div>
    <input id="chat-input" type="text" maxlength="100" placeholder="输入消息...">
    <div style="margin-top: 10px; text-align: right;">
      <button id="chat-cancel" style="
        padding: 6px 14px; margin-right: 6px; cursor: pointer;
        background: #444; color: #fff; border: none; border-radius: 5px;
      ">取消</button>
      <button id="chat-send" style="
        padding: 6px 14px; cursor: pointer;
        background: #4a8; color: #fff; border: none; border-radius: 5px;
      ">发送</button>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <script>
    // ============ 1. 生成随机身份 ============
    function randomName() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      const len = 3 + Math.floor(Math.random() * 3); // 3~5 位
      let s = '';
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }
    function randomColor() {
      return new THREE.Color(Math.random(), Math.random(), Math.random());
    }

    const myName = randomName();
    const myColor = randomColor();
    document.getElementById('name-tag').textContent = '你是: ' + myName;

    // ============ 2. Three.js 场景 ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);
    scene.fog = new THREE.Fog(0x111122, 50, 150);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(30, 50, 20);
    scene.add(dirLight);

    const boardSize = 100;
    const grid = new THREE.GridHelper(boardSize, boardSize, 0x444466, 0x222244);
    scene.add(grid);

    // ============ 3. 创建自己的立方体 ============
    const cubeGeo = new THREE.BoxGeometry(2, 2, 2);
    const myMat = new THREE.MeshStandardMaterial({ color: myColor });
    const myCube = new THREE.Mesh(cubeGeo, myMat);
    myCube.position.set(
      (Math.random() - 0.5) * boardSize,
      1,
      (Math.random() - 0.5) * boardSize
    );
    scene.add(myCube);

    function makeLabel(text, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.font = 'bold 40px monospace';
      ctx.fillStyle = '#' + color.getHexString();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(6, 1.5, 1);
      return sprite;
    }
    myCube.add(makeLabel(myName, myColor).translateY(2.5));

    // ============ 4. 键盘控制 ============
    const keys = {};
    addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

    const moveSpeed = 0.3;
    const rotSpeed = 0.04;

    function updateMyCube() {
      if (keys['w'] || keys['arrowup']) {
        myCube.position.x += Math.sin(myCube.rotation.y) * moveSpeed;
        myCube.position.z += Math.cos(myCube.rotation.y) * moveSpeed;
      }
      if (keys['s'] || keys['arrowdown']) {
        myCube.position.x -= Math.sin(myCube.rotation.y) * moveSpeed;
        myCube.position.z -= Math.cos(myCube.rotation.y) * moveSpeed;
      }
      if (keys['a'] || keys['arrowleft'])  myCube.rotation.y += rotSpeed;
      if (keys['d'] || keys['arrowright']) myCube.rotation.y -= rotSpeed;

      const half = boardSize / 2;
      myCube.position.x = Math.max(-half, Math.min(half, myCube.position.x));
      myCube.position.z = Math.max(-half, Math.min(half, myCube.position.z));
    }

    function updateCamera() {
      const offset = new THREE.Vector3(0, 8, -14);
      offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), myCube.rotation.y);
      const targetPos = myCube.position.clone().add(offset);
      camera.position.lerp(targetPos, 0.1);
      camera.lookAt(myCube.position);
    }

    // ============ 5. MQTT 连接 ============
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const TOPIC = 'mygame/cubes/room1';

    const remoteCubes = {}; // name -> { mesh, lastSeen }
    const bubbles = {};     // name -> { el, message }

    client.on('connect', () => {
      console.log('MQTT 已连接');
      client.subscribe(TOPIC);
      client.subscribe(TOPIC + '/chat/' + myName);
      setInterval(broadcastMyState, 100);
    });

    function broadcastMyState() {
      const msg = {
        name: myName,
        color: myColor.getHex(),
        x: myCube.position.x,
        z: myCube.position.z,
        ry: myCube.rotation.y
      };
      client.publish(TOPIC, JSON.stringify(msg));
    }

    client.on('message', (topic, payload) => {
      let data;
      try { data = JSON.parse(payload.toString()); } catch (e) { return; }

      // ---- 聊天消息 ----
      if (topic.includes('/chat/')) {
        showBubble(data.from, data.text);
        return;
      }

      // ---- 位置广播 ----
      if (data.name === myName) return;

      if (!remoteCubes[data.name]) {
        const color = new THREE.Color(data.color);
        const mat = new THREE.MeshStandardMaterial({ color });
        const mesh = new THREE.Mesh(cubeGeo, mat);
        mesh.add(makeLabel(data.name, color).translateY(2.5));
        scene.add(mesh);
        remoteCubes[data.name] = { mesh, lastSeen: Date.now() };
        console.log('新玩家:', data.name);
      }

      const rc = remoteCubes[data.name];
      rc.mesh.position.set(data.x, 1, data.z);
      rc.mesh.rotation.y = data.ry;
      rc.lastSeen = Date.now();
    });

    // 定期清理掉线玩家
    setInterval(() => {
      const now = Date.now();
      for (const name in remoteCubes) {
        if (now - remoteCubes[name].lastSeen > 3000) {
          scene.remove(remoteCubes[name].mesh);
          delete remoteCubes[name];
          if (bubbles[name]) {
            bubbles[name].el.remove();
            delete bubbles[name];
          }
          console.log('玩家离开:', name);
        }
      }
    }, 1000);

    // ============ 6. 双击发消息 ============
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('dblclick', (event) => {
      mouse.x = (event.clientX / innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const targets = Object.values(remoteCubes).map(rc => rc.mesh);
      const hits = raycaster.intersectObjects(targets, false);

      if (hits.length > 0) {
        const hitMesh = hits[0].object;
        for (const name in remoteCubes) {
          if (remoteCubes[name].mesh === hitMesh) {
            openChatBox(name);
            break;
          }
        }
      }
    });

    const chatBox = document.getElementById('chat-box');
    const chatInput = document.getElementById('chat-input');
    const chatTargetDiv = document.getElementById('chat-target');
    let chatTarget = null;

    function openChatBox(name) {
      chatTarget = name;
      chatTargetDiv.textContent = '发送给: ' + name;
      chatBox.style.display = 'block';
      chatInput.value = '';
      chatInput.focus();
    }

    document.getElementById('chat-cancel').onclick = () => {
      chatBox.style.display = 'none';
      chatTarget = null;
    };

    document.getElementById('chat-send').onclick = () => {
      const text = chatInput.value.trim();
      if (!text || !chatTarget) return;

      const msg = {
        from: myName,
        to: chatTarget,
        text: text,
        time: Date.now()
      };
      client.publish(TOPIC + '/chat/' + chatTarget, JSON.stringify(msg));

      chatBox.style.display = 'none';
      chatTarget = null;
    };

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('chat-send').click();
    });

    // ============ 7. 气泡显示 ============
    function showBubble(fromName, text) {
      if (bubbles[fromName]) {
        bubbles[fromName].el.remove();
      }

      const el = document.createElement('div');
      el.className = 'bubble';
      el.textContent = '💬';
      el.title = '点击查看消息';
      document.body.appendChild(el);

      el.onclick = () => {
        alert(fromName + ' 对你说：\n\n' + text);
        el.remove();
        delete bubbles[fromName];
      };

      bubbles[fromName] = { el, message: text };
    }

    function updateBubbles() {
      for (const name in bubbles) {
        const rc = remoteCubes[name];
        if (!rc) continue;

        const pos = rc.mesh.position.clone();
        pos.y += 3.5;
        pos.project(camera);

        if (pos.z > 1) {
          bubbles[name].el.style.display = 'none';
        } else {
          bubbles[name].el.style.display = 'block';
          const x = (pos.x * 0.5 + 0.5) * innerWidth;
          const y = (-pos.y * 0.5 + 0.5) * innerHeight;
          bubbles[name].el.style.left = (x - 14) + 'px';
          bubbles[name].el.style.top = (y - 14) + 'px';
        }
      }
    }

    // ============ 8. 主循环 ============
    function animate() {
      requestAnimationFrame(animate);
      updateMyCube();
      updateCamera();
      updateBubbles();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
